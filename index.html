S",t:Tt(560),at:Gt(640),onTrail:!0,text:"We ascended an incline skirting massive boulders, piercing upward out of the Martian soil. They threw long black shadows, behind which the temperature instantly dropped from −25 °C to −57 °C. We avoided shadows to conserve energy."},{id:"gully",title:"THE GULLY",t:Tt(965),at:Gt(1e3),onTrail:!0,text:"The short journey was mostly uneventful. Near the end of our trek, after cresting a shallow gully, we arrived in the center of a flat area."},{id:"target",title:"THE TARGET",t:g("satko")-4,at:Te(jt(0,0),Ut.y),onTrail:!1,text:"Gazing at my wrist-com, I pointed at the ground: this was the target. I shone my headlamp in every direction, but I saw nothing. Flat ground. Nothing unusual. Gomez stared at me, arms hanging at his side. I recalculated, in case of coordinate-drift."},{id:"search",off:!0,title:"THE SEARCH",t:z.SEARCH,at:Te(jt(-12,9),Ut.y),onTrail:!1,text:"For the next few minutes, the four of us chaotically scrambled around the flat, headlamps pointed in every direction. Something had to be transmitting, but the dark quickly closed in around us. Up to a point I had felt warm enough, but soon the frigid surface temperatures began to seep through the insulation of my farm-suit. I turned my suit up three degrees."},{id:"quinn",off:!0,title:"QUINN",t:z.QUINN,at:At("satko",z.QUINN),onTrail:!1,screen:["QUINN"],text:"Shivering, I lifted my wrist. In the center of my wrist-com blinked the word QUINN. A short range network. I clumsily tapped my wrist-com. The word disappeared, replaced by: Welcome to Q.U.I.N.N. Research Laboratory."},{id:"identify",off:!0,title:"IDENTIFY",t:z.IDENTIFY,at:At("satko",z.IDENTIFY),onTrail:!1,screen:["Identify:  Ida Satko","[SEND]"],text:"Before I touched the screen a second time, another message appeared. I didn’t hesitate to enter my full name: Ida Satko. With the Captain’s permission, I pressed SEND."},{id:"colour",off:!0,title:"PICK A COLOR",t:z.COLOUR,at:At("satko",z.COLOUR),onTrail:!1,screen:["Welcom ALL",t:z.J3-2.5,at:Qt.clone(),onTrail:!1,text:"And then… blinding light. I fell through the air. Li and Gomez caught me and practically threw me to the side. I landed, supine, a turtle on its back."},{id:"jump",off:!0,title:"THE JUMP",t:z.JUMP-4,at:Te(B,Ut.y),onTrail:!1,text:"In blueish light, the Captain was a silhouette against a high architectural ledge. Li and Gomez backed up. The Captain jumped. Maybe it was the lack of gravity, but she seemed to float down, rolling elegantly as she hit the ground. She checked my suit and vital signs, then followed my gaze."},{id:"cylinder",title:"THE SEAL",t:1392,at:Te(jt(0,0),Ut.y+11.6),onTrail:!1,text:"A towering cylindrical structure rotated clockwise out of the Martian soil like a corkscrew: an immense amount of power, raw and geometrically perfect, as if turned on a gigantic lathe. I felt a snap as it stopped ascending. Its lid stood high above us; its curved exterior gleamed with a mirror-like smoothness. At its base, an inset stem supported the weight of the massive cylinder above."}].filter(R=>!R.off).map((R,N)=>({...R,n:N+1})),Kt=Z_((R,N)=>st(R,N));return{tracks:t,pose:bt,focus:ut,where:(R,N)=>st(R,N),points:Lt,vitals:Kt,timeAtTrail:R=>R>Ca-30?g("satko"):Tt(R)}}function Z_(i){const t=Math.ceil(z.END)+2,e={hamlin:66,satko:74,li:70,gomez:78},n={hamlin:[[z.RUN,48,60],[z.CLIMB,30,70],[z.J3,20,50],[z.JUMP,14,50]],satko:[[z.QUINN,14,50],[z.WELCOME,8,40],[z.SEND,10,40],[z.WHITE,12,40],[z.GRANTED,26,80],[z.J1,50,60],[z.J2,40,60],[z.GRAB,20,40],[z.J3,25,60]],li:[[z.WELCOME,8,40],[z.COLOUR,10,40],[z.J1,22,40],[z.J2,30,60],[z.J3,30,60]],gomez:[[z.COLOUR,14,40],[z.J1,26,40],[z.J2,34,60],[z.J3,32,60]]},s={},r=o=>1-Ad(-3,4,Df(o));for(const o of["hamlin","satko","li","gomez"]){const a=new Float32Array(t),l=new Float32Array(t),c=new Float32Array(t),h=new Float32Array(t);let f=e[o],u=99.2-(o==="gomez"?.4:0),p=21,g=i(o,0);for(let M=0;M<t;M++){const x=i(o,M+1),d=Math.hypot(x.x-g.x,x.z-g.z);g=x;let v=e[o]+30*Math.min(1.8,d)+6*Math.min(1,
