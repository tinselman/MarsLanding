 STRIDE",t:Nt(270),at:mt(270),onTrail:!0,text:"Initially, our progress was slow: more difficult than I imagined. The farm-suit was unwieldy and I struggled to adapt a stride, but within minutes, we started making good time. More than once, I caught myself chuckling."},{id:"back",title:"LOOKING BACK",t:Nt(410),at:mt(410),onTrail:!0,text:"When I looked backwards, the lander had all-but-vanished into the Martian evening. I could barely see its landing lights. This wasn’t another practice simulation. Here I was, after years of research, preparations, and formulations, bounding across the surface of Mars."},{id:"boulders",title:"THE BOULDERS",t:Nt(560),at:mt(640),onTrail:!0,text:"We ascended an incline skirting massive boulders, piercing upward out of the Martian soil. They threw long black shadows, behind which the temperature instantly dropped from −25 °C to −57 °C. We avoided shadows to conserve energy."},{id:"gully",title:"THE GULLY",t:Nt(965),at:mt(1e3),onTrail:!0,text:"The short journey was mostly uneventful. Near the end of our trek, after cresting a shallow gully, we arrived in the center of a flat area."},{id:"target",title:"THE TARGET",t:_("satko")-4,at:Ae(Jt(0,0),Et.y),onTrail:!1,text:"Gazing at my wrist-com, I pointed at the ground: this was the target. I shone my headlamp in every direction, but I saw nothing. Flat ground. Nothing unusual. Gomez stared at me, arms hanging at his side. I recalculated, in case of coordinate-drift."},{id:"search",off:!0,title:"THE SEARCH",t:I.SEARCH,at:Ae(Jt(-12,9),Et.y),onTrail:!1,text:"For the next few minutes, the four of us chaotically scrambled around the flat, headlamps pointed in every direction. Something had to be transmitting, but the dark quickly closed in around us. Up to a point I had felt warm enough, but soon the frigid surface temperatures began to seep through the insulation of my farm-suit. I turned my suit up three degrees."},{id:"quinn",off:!0,title:"QUINN",t:I.QUINN,at:Xt("satko",I.QUINN),onTrail:!1,screen:["QUINN"],text:"Shivering, I lifted my wrist. In the center of my wrist-com blinked the word QUINN. A short range network. I clumsily tapped my wrist-com. The word disappeared, replaced by: Welcome to Q.U.I.N.N. Research Laboratory."},{id:"identify",off:!0,title:"IDENTIFY",t:I.IDENTIFY,at:Xt("satko",I.IDENTIFY),onTrail:!1,screen:["Identify:  Ida Satko","[SEND]"],text:"Before I touched the screen a second time, another message appeared. I didn’t hesitate to enter my full name: Ida Satko. With the Captain’s permission, I pressed SEND."},{id:"colour",off:!0,title:"PICK A COLOR",t:I.COLOUR,at:Xt("satko",I.COLOUR),onTrail:!1,screen:["Welcome, Ida!","Pick a color","[WHITE]    [BLACK]"],text:"Almost instantly, it welcomed me by name and asked me to pick a color. I pressed WHITE."},{id:"granted",off:!0,title:"APPROVAL GRANTED",t:I.GRANTED,at:Xt("satko",I.GRANTED),onTrail:!1,screen:["IDA SATKO","Approval Granted-","—Initiating unseal procedure—"],text:"But nothing happened. No unsealing. Nevertheless, my heart pounded. We had stumbled upon an uncharted, antiquated network, millions of miles from Earth. I had scaled to the top of a mountain. Now I saw another peak to climb."},{id:"leave",off:!0,title:"FALL IN LINE",t:I.LEAVE,at:Xt("hamlin",I.STOPPED),onTrail:!1,screen:["—Initiating unseal procedure—"],text:"The Captain called it a night. Spinning, she strode away into the darkness, Li after her, single file, Gomez at the rear. A few meters away he stopped and turned; I gave him a thumbs up. I took the last few seconds to search for a phased-array dish, for footprints, for tire-tracks. If there had once been something here, it was covered with a layer of dust. About 30 meters away, they had stopped, their headlamps trained on me."},{id:"jolt",off:!0,title:"THE JOLT",t:I.J1-3,at:Ae(L,Et.y),onTrail:!1,text:"Before I could lift my foot to take a step, the ground jolted upward. A sound, like the snap of metal, travelled through my bones. I was thrown into the air and landed on my back. The Captain’s lamp came bouncing toward me."},{id:"spring",off:!0,title:"THE SPRING",t:I.J2-5,at:Ae(Z,Et.y+1.6),onTrail:!1,text:"I rolled to my hands and knees. A snap ran the length of my body. The ground shot upwards as if held by a spring. I landed on my stomach; pebbles bounced and boiled on all sides. The ground pulsed."},{id:"wrist",off:!0,title:"THE CAPTAIN",t:I.CLIMB-1,at:Ae(Jt(4.5,-2.3),Et.y+2.2),onTrail:!1,text:"Out of nowhere, someone seized hold of my wrist and dragged me across the dirt. I couldn’t see a thing. Darkness. Screaming thunder came from all directions. It was the Captain."},{id:"fall",off:!0,title:"THE FALL",t:I.J3-2.5,at:rt.clone(),onTrail:!1,text:"And then… blinding light. I fell through the air. Li and Gomez caught me and practically threw me to the side. I landed, supine, a turtle on its back."},{id:"jump",off:!0,title:"THE JUMP",t:I.JUMP-4,at:Ae(ue,Et.y),onTrail:!1,text:"In blueish light, the Captain was a silhouette against a high architectural ledge. Li and Gomez backed up. The Captain jumped. Maybe it was the lack of gravity, but she seemed to float down, rolling elegantly as she hit the ground. She checked my suit and vital signs, then followed my gaze."},{id:"cylinder",title:"THE SEAL",t:1392,at:Ae(Jt(0,0),Et.y+12.85),onTrail:!1,text:"A towering cylindrical structure rotated clockwise out of the Martian soil like a corkscrew: an immense amount of power, raw and geometrically perfect, as if turned on a gigantic lathe. I felt a snap as it stopped ascending. Its lid stood high above us; its curved exterior gleamed with a mirror-like smoothness. At its base, an inset stem supported the weight of the massive cylinder above."},{id:"plaque",title:"THE PLAQUE",t:I.PLAQUE,from:I.STOP,close:!0,onTrail:!1,at:new C(Et.x+(Kn+.02)*Math.sin(Bs),Ks(Bs)+1.6,Et.z+(Kn+.02)*Math.cos(Bs)),screenLabel:"PLAQUE",screen:["Q.U.I.N.N. Research Laboratories","N.N.","Established 2161","Consecrated, 2161"],text:"Embossed letters on a curved wall of the ax #hud .panel .scr .lbl { font-size: 9px; letter-spacing: 0.16em; color: rgba(255,255,255,0.42); margin-bottom: 4px; }
#hud .panel.hidden { display: none; }
#hud .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 132px;
  background: linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0.5) 62%, rgba(0,0,0,0)); }
#hud .tr { position: absolute; left: 12px; bottom: 10px; display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: bold; color: rgba(255,255,255,0.68); }
/* each button a fixed, generous target, whatever its glyph (the play arrow is half the pause bars' width) */
#hud .tr button { min-width: 34px; height: 32px; display: inline-flex; align-items: center; justify-content: center; }
#hud .tr .rate { margin-left: 6px; min-width: 64px; font-size: 11px; letter-spacing: 0.08em; color: rgba(255,255,255,0.86); }
#hud .tr .pace { display: flex; margin-left: 10px; }
#hud .tr .pace button { font-size: 11px; letter-spacing: 0.04em; color: rgba(255,255,255,0.55); }
#hud .tr .pace button[data-s=auto] { min-width: 50px; }
#hud .tr .pace button.on { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
/* the story's moments over the slider: the map's circled numbers */
#hud .marks { position: absolute; left: 20px; bottom: 80px; height: 22px; }
#hud .marks svg { position: absolute; left: 0; top: 0; width: 100%; height: 34px; overflow: visible; pointer-events: none; }
#hud .marks .mk { position: absolute; top: 0; width: 18px; height: 18px; margin-left: -9px; box-sizing: border-box; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.7); background: rgba(0,0,0,0.62); color: rgba(255,255,255,0.88); font-size: 9px; font-weight: bold;
  display: flex; align-items: center; justify-content: center; padding: 0; pointer-events: auto; cursor: pointer; }
#hud .marks .mk:hover { border-color: #fff; color: #fff; }
#hud .marks .mk.on { background: rgba(255,255,255,0.95); color: #000; border-color: #fff; }
#hud .bar { position: absolute; left: 20px; bottom: 50px; height: 26px; cursor: pointer; }
#hud .bar .line { position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: rgba(255,255,255,0.32); }
#hud .bar .done { position: absolute; left: 0; top: 11px; height: 3px; background: rgba(255,255,255,0.82); }
#hud .bar .knob { position: absolute; top: 5px; width: 3px; height: 16px; margin-left: -1px; background: #fff; }
#hud .bar .tick { position: absolute; top: 7px; width: 1px; height: 6px; background: rgba(255,255,255,0.5); }
#hud .bar .tick.big { height: 12px; top: 1px; background: rgba(255,255,255,0.62); }
#hud .bar .tip { position: absolute; bottom: 24px; transform: translateX(-50%); font-size: 10px; letter-spacing: 0.1em; white-space: nowrap; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.7); padding: 3px 6px; }
#hud .clock { position: absolute; right: 20px; bottom: 16px; text-align: right; width: 196px; }
#hud .clock .hm { font-size: 22px; font-weight: bold; letter-spacing: 0.06em; }
#hud .clock .sub { font-size: 10px; letter-spacing: 0.12em; color: rgba(255,255,255,0.5); margin-top: 3px; line-height: 1.55; }
#hud .vit { position: absolute; bottom: 16px; display: flex; gap: 16px; }
#hud .vit .m { width: 74px; font-size: 10px; line-height: 1.55; color: rgba(255,255,255,0.62); pointer-events: auto; cursor: pointer; }
#hud .vit .m:hover .nm, #hud .vit .m.on .nm { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
#hud .vit .m .nm { font-weight: bold; letter-spacing: 0.12em; color: rgba(255,255,255,0.88); margin-bottom: 2px; }
#hud .vit .m b { color: rgba(255,255,255,0.92); font-weight: bold; }
#hud .vit .m.hot .hr b { color: #fff; }
#hud .vit canvas { display: block; width: 74px; height: 16px; margin: 2px 0 1px; }
#hud .back { position: absolute; left: 50%; bottom: 114px; transform: translateX(-50%); display: none; font-size: 12px; font-weight: bold; letter-spacing: 0.14em;
  color: #fff; background: rgba(0,0,0,0.66); border: 1px solid rgba(255,255,255,0.6); padding: 8px 16px; }
#hud .back:hover { background: rgba(255,255,255,0.14); }
#hud .back { animation: qnblink 0.9s steps(2, start) infinite; }
#hud .tr .ended { color: #ff3b30; animation: qnblink 1s steps(2, start) infinite; }
/* (a fade, not visibility: a hidden button cannot be clicked) */
@keyframes qnblink { to { opacity: 0.18; } }
#hud .load { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 11px; letter-spacing: 0.3em; color: rgba(255,255,255,0.6); }
#hud .hint { position: absolute; right: 20px; top: 40px; font-size: 10px; letter-spacing: 0.08em; color: rgba(255,255,255,0.4); text-align: right; }
@media (max-width: 760px) {
  #hud .title { left: 12px; top: 12px; font-size: 11px; letter-spacing: 0.4em; }
  #hud .title small { display: none; }
  #hud .views { top: 34px; left: 12px; right: auto; gap: 15px; font-size: 10.5px; }
  #hud .hint { display: none; }
  #hud .panel { left: 10px; right: 10px; width: auto; top: auto; bottom: 238px; max-height: calc(100% - 300px); padding: 9px 12px 8px; }
  #hud .panel .ttl { margin: 4px 0 5px; font-size: 11.5px; }
  #hud .panel .txt { font-size: 10.5px; line-height: 1.5; }
  #hud .bottom { height: 238px; }
  #hud .vit { gap: 8px; bottom: 118px; left: 12px; right: 12px !important; }
  #hud .vit .m { width: auto; flex: 1; font-size: 9px; line-height: 1.45; }
  #hud .vit canvas { width: 100%; height: 12px; }
  #hud .bar { bottom: 62px; left: 12px; right: 12px !important; }
  #hud .marks { left: 12px; right: 12px !important; bottom: 90px; }
  #hud .marks .mk { width: 15px; height: 15px; margin-left: -7.5px; font-size: 8px; }
  #hud .tr { left: 4px; bottom: 8px; gap: 0; font-size: 13px; }
  #hud .tr button { min-width: 34px; height: 38px; }
  #hud .tr .rate { display: none; }
  #hud .tr .pace { margin-left: 2px; }
  #hud .tr button { min-width: 30px; }
  #hud .tr .pace button { min-width: 26px; }
  #hud .tr .pace button[data-s=auto] { min-width: 38px; }
  #hud .back { bottom: 246px; }
  #hud .clock { bottom: 13px; right: 12px; width: auto; }
  #hud .clock .hm { font-size: 16px; }
  #hud .clock .sub { font-size: 9px; }
  #hud .clock .sub .long, #hud .clock .sub .dot { display: none; }
  #hud .clock .sub .ext { display: block; }
}
