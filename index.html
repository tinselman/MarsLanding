t=R=>{const N=ph(R);return new L(N.x,xe(N.x,N.z),N.z)},At=(R,N)=>st(R,N),Lt=[{id:"lander",title:"THE LANDER",t:0,at:Te(tr($s,1.5,-4.5),Bc),onTrail:!0,text:"After depressurizing the cabin, we walked out the back ramp. Red dust covered the lander. In the distance: a blue-gray horizon."},{id:"order",title:"STAY TOGETHER",t:k.OFF-8,at:Gt(p+8),onTrail:!0,text:"The Captain bounded off west-north-west, toward the target, 1.1 kilometers away. At first the rest of us stumbled to keep up."},{id:"mons",title:"TYRRHENUS MONS",t:wt(150),at:Gt(150),onTrail:!0,text:"Gomez and I stayed close. High above us rose the peak of Tyrrhenus Mons."},{id:"stride",title:"A STRIDE",t:wt(270),at:Gt(270),onTrail:!0,text:"Initially, our progress was slow: more difficult than I imagined. The farm-suit was unwieldy and I struggled to adapt a stride, but within minutes, we started making good time. More than once, I caught myself chuckling."},{id:"back",title:"LOOKING BACK",t:wt(410),at:Gt(410),onTrail:!0,text:"When I looked backwards, the lander had all-but-vanished into the Martian evening. I could barely see its landing lights. This wasn’t another practice simulation. Here I was, after years of research, preparations, and formulations, bounding across the surface of Mars."},{id:"boulders",title:"THE BOULDERS",t:wt(560),at:Gt(640),onTrail:!0,text:"We ascended an incline skirting massive boulders, piercing upward out of the Martian soil. They threw long black shadows, behind which the temperature instantly dropped from −25 °C to −57 °C. We avoided shadows to conserve energy."},{id:"gully",title:"THE GULLY",t:wt(965),at:Gt(1e3),onTrail:!0,text:"The short journey was mostly uneventful. Near the end of our trek, after cresting a shallow gully, we arrived in the center of a flat area."},{id:"target",title:"THE TARGET",t:g("satko")-4,at:Te(jt(0,0),kt.y),onTrail:!1,text:"Gazing at my wrist-com, I pointed at the ground: this was the target. I shone my headlamp in every direction, but I saw nothing. Flat ground. Nothing unusual. Gomez stared at me, arms hanging at his side. I recalculated, in case of coordinate-drift."},{id:"search",title:"THE SEARCH",t:k.SEARCH,at:Te(jt(-12,9),kt.y),onTrail:!1,text:"For the next few minutes, the four of us chaotically scrambled around the flat, headlamps pointed in every direction. Something had to be transmitting, but the dark quickly closed in around us. Up to a point I had felt warm enough, but soon the frigid surface temperatures began to seep through the insulation of my farm-suit. I turned my suit up three degrees."},{id:"quinn",title:"QUINN",t:k.QUINN,at:At("satko",k.QUINN),onTrail:!1,screen:["QUINN"],text:"Shivering, I lifted my wrist. In the center of my wrist-com blinked the word QUINN. A short range network. I clumsily tapped my wrist-com. The word disappeared, replaced by: Welcome to Q.U.I.N.N. Research Laboratory."},{id:"identify",title:"IDENTIFY",t:k.IDENTIFY,at:At("satko",k.IDENTIFY),onTrail:!1,screen:["Identify:  Ida Satko","[SEND]"],text:"Before I touched the screen a second time, another message appeared. I didn’t hesitate to enter my full name: Ida Satko. With the Captain’s permission, I pressed SEND."},{id:"colour",title:"PICK A COLOR",t:k.COLOUR,at:At("satko",k.COLOUR),onTrail:!1,screen:["Welcome, Ida!","Pick a color","[WHITE]    [BLACK]"],text:"Almost instantly, it welcomed me by name and asked me to pick a color. I pressed WHITE."},{id:"granted",title:"APPROVAL GRANTED",t:k.GRANTED,at:At("satko",k.GRANTED),onTrail:!1,screen:["IDA SATKO","Approval Granted-","—Initiating unseal procedure—"],text:"But nothing happened. No unsealing. Nevertheless, my heart pounded. We had stumbled upon an uncharted, antiquated network, millions of miles from Earth. I had scaled to the top of a mountain. Now I saw another peak to climb."},{id:"leave",title:"FALL IN LINE",t:k.LEAVE,at:At("hamlin",k.STOPPED),onTrail:!1,screen:["—Initiating unseal procedure—"],text:"The Captain called it a night. Spinning, she strode away into the darkness, Li after her, single file, Gomez at the rear. A few meters away he stopped and turned; I gave him a thumbs up. I took the last few seconds to search for a phased-array dish, for footprints, for tire-tracks. If there had once been something here, it was covered with a layer of dust. About 30 meters away, they had stopped, their headlamps trained on me."},{id:"jolt",title:"THE JOLT",t:k.J1-3,at:Te(I,kt.y),onTrail:!1,text:"Before I could lift my foot to take a step, the ground jolted upward. A sound, like the snap of metal, travelled through my bones. I was thrown into the air and landed on my back. The Captain’s lamp came bouncing toward me."},{id:"spring",title:"THE SPRING",t:k.J2-5,at:Te(Mt,kt.y+1.6),onTrail:!1,text:"I rolled to my hands and knees. A snap ran the length of my body. The ground shot upwards as if held by a spring. I landed on my stomach; pebbles bounced and boiled on all sides. The ground pulsed."},{id:"wrist",title:"THE CAPTAIN",t:k.CLIMB-1,at:Te(jt(4.5,-2.3),kt.y+2.2),onTrail:!1,text:"Out of nowhere, someone seized hold of my wrist and dragged me across the dirt. I couldn’t see a thing. Darkness. Screaming thunder came from all directions. It was the Captain."},{id:"fall",title:"THE FALL",t:k.J3-2.5,at:Qt.clone(),onTrail:!1,text:"And then… blinding light. I fell through the air. Li and Gomez caught me and practically threw me to the side. I landed, supine, a turtle on its back."},{id:"jump",title:"THE JUMP",t:k.JUMP-4,at:Te(B,kt.y),onTrail:!1,text:"In blueish light, the Captain was a silhouette against a high architectural ledge. Li and Gomez backed up. The Captain jumped. Maybe it was the lack of gravity, but she seemed to float down, rolling elegantly as she hit the ground. She checked my suit and vital signs, then followed my gaze."},{id:"cylinder",title:"THE CYLINDER",t:1392,at:Te(jt(0,0),kt.y+11.6),onTrail:!1,text:"A towering cylindrical structure rotated clockwise out of the Martian soil like a corkscrew: an immense amount of power, raw
