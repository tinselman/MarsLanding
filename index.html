s mostly uneventful. Near the end of our trek, after cresting a shallow gully, we arrived in the center of a flat area."},{id:"target",title:"THE TARGET",t:_("satko")-4,at:Ie($t(0,0),vt.y),onTrail:!1,text:"Gazing at my wrist-com, I pointed at the ground: this was the target. I shone my headlamp in every direction, but I saw nothing. Flat ground. Nothing unusual. Gomez stared at me, arms hanging at his side. I recalculated, in case of coordinate-drift."},{id:"search",off:!0,title:"THE SEARCH",t:N.SEARCH,at:Ie($t(-12,9),vt.y),onTrail:!1,text:"For the next few minutes, the four of us chaotically scrambled around the flat, headlamps pointed in every direction. Something had to be transmitting, but the dark quickly closed in around us. Up to a point I had felt warm enough, but soon the frigid surface temperatures began to seep through the insulation of my farm-suit. I turned my suit up three degrees."},{id:"quinn",off:!0,title:"QUINN",t:N.QUINN,at:rs("satko",N.QUINN),onTrail:!1,screen:["QUINN"],text:"Shivering, I lifted my wrist. In the center of my wrist-com blinked the word QUINN. A short range network. I clumsily tapped my wrist-com. The word disappeared, replaced by: Welcome to Q.U.I.N.N. Research Laboratory."},{id:"identify",off:!0,title:"IDENTIFY",t:N.IDENTIFY,at:rs("satko",N.IDENTIFY),onTrail:!1,screen:["Identify:  Ida Satko","[SEND]"],text:"Before I touched the screen a second time, another message appeared. I didn’t hesitate to enter my full name: Ida Satko. With the Captain’s permission, I pressed SEND."},{id:"colour",off:!0,title:"PICK A COLOR",t:N.COLOUR,at:rs("satko",N.COLOUR),onTrail:!1,screen:["Welcome, Ida!","Pick a color","[WHITE]    [BLACK]"],text:"Almost instantly, it welcomed me by name and asked me to pick a color. I pressed WHITE."},{id:"granted",off:!0,title:"APPROVAL GRANTED",t:N.GRANTED,at:rs("satko",N.GRANTED),onTrail:!1,screen:["IDA SATKO","Approval Granted-","—Initiating unseal procedure—"],text:"But nothing happened. No unsealing. Nevertheless, my heart pounded. We had stumbled upon an uncharted, antiquated network, millions of miles from Earth. I had scaled to the top of a mountain. Now I saw another peak to climb."},{id:"leave",off:!0,title:"FALL IN LINE",t:N.LEAVE,at:rs("hamlin",N.STOPPED),onTrail:!1,screen:["—Initiating unseal procedure—"],text:"The Captain called it a night. Spinning, she strode away into the darkness, Li after her, single file, Gomez at the rear. A few meters away he stopped and turned; I gave him a thumbs up. I took the last few seconds to search for a phased-array dish, for footprints, for tire-tracks. If there had once been something here, it was covered with a layer of dust. About 30 meters away, they had stopped, their headlamps trained on me."},{id:"jolt",off:!0,title:"THE JOLT",t:N.J1-3,at:Ie(G,vt.y),onTrail:!1,text:"Before I could lift my foot to take a step, the ground jolted upward. A sound, like the snap of metal, travelled through my bones. I was thrown into the air and landed on my back. The Captain’s lamp came bouncing toward me."},{id:"spring",off:!0,title:"THE SPRING",t:N.J2-5,at:Ie(ie,vt.y+1.6),onTrail:!1,text:"I rolled to my hands and knees. A snap ran the length of my body. The ground shot upwards as if held by a spring. I landed on my stomach; pebbles bounced and boiled on all sides. The ground pulsed."},{id:"wrist",off:!0,title:"THE CAPTAIN",t:N.CLIMB-1,at:Ie($t(4.5,-2.3),vt.y+2.2),onTrail:!1,text:"Out of nowhere, someone seized hold of my wrist and dragged me across the dirt. I couldn’t see a thing. Darkness. Screaming thunder came from all directions. It was the Captain."},{id:"fall",off:!0,title:"THE FALL",t:N.J3-2.5,at:Ie(Je([Ot.x,Ot.z],en),Ot.y),onTrail:!1,text:"And then… blinding light. I fell through the air. Li and Gomez caught me and practically threw me to the side. I landed, supine, a turtle on its back."},{id:"jump",off:!0,title:"THE JUMP",t:N.JUMP-4,at:Ie(Je(st,di),vt.y),onTrail:!1,text:"In blueish light, the Captain was a silhouette against a hig /* (a fade, not visibility: a hidden button cannot be clicked) */
@keyframes qnblink { to { opacity: 0.18; } }
#hud .load { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 11px; letter-spacing: 0.3em; color: rgba(255,255,255,0.6); }
#hud .hint { position: absolute; right: 20px; top: 40px; font-size: 10px; letter-spacing: 0.08em; color: rgba(255,255,255,0.4); text-align: right; }
@media (max-width: 760px) {
  #hud .title { left: 12px; top: 12px; font-size: 11px; letter-spacing: 0.4em; }
  #hud .title small { display: none; }
  #hud .views { top: 34px; left: 12px; right: auto; gap: 15px; font-size: 10.5px; }
  #hud .hint { display: none; }
  #hud .panel { left: 10px; right: 10px; width: auto; top: auto; bottom: 238px; max-height: calc(100% - 300px); padding: 9px 12px 8px; }
  #hud .panel .ttl { margin: 4px 0 5px; font-size: 11.5px; }
  #hud .panel .txt { font-size: 10.5px; line-height: 1.5; }
  #hud .bottom { height: 238px; }
  #hud .vit { gap: 8px; bottom: 118px; left: 12px; right: 12px !important; }
  #hud .vit .m { width: auto; flex: 1; font-size: 9px; line-height: 1.45; }
  #hud .vit canvas { width: 100%; height: 12px; }
  #hud .bar { bottom: 62px; left: 12px; right: 12px !important; }
  #hud .marks { left: 12px; right: 12px !important; bottom: 90px; }
  #hud .marks .mk { width: 15px; height: 15px; margin-left: -7.5px; font-size: 8px; }
  #hud .tr { left: 4px; bottom: 8px; gap: 0; font-size: 13px; }
  #hud .tr button { min-width: 34px; height: 38px; }
  #hud .tr .rate { display: none; }
  #hud .tr .pace { margin-left: 2px; }
  #hud .tr button { min-width: 30px; }
  #hud .tr .pace button { min-width: 26px; }
  #hud .tr .pace button[data-s=auto] { min-width: 38px; }
  #hud .back { bottom: 246px; }
  #hud .clock { bottom: 13px; right: 12px; width: auto; }
  #hud .clock .hm { font-size: 16px; }
  #hud .clock .sub { font-size: 9px; }
  #hud .clock .sub .long, #hud .clock .sub .dot { display: none; }
  #hud .clock .sub .ext { display: block; }
}
/* a tablet (or a narrow window): the vitals over the slider, the slider the width of the frame */
@media (min-width: 761px) and (max-width: 1180px) {
  #hud .bottom { height: 200px; }
  #hud .vit { bottom: 104px; }
  #hud .back { bottom: 178px; }
  #hud .panel { max-height: calc(100% - 300px); }
  #hud .hint { display: none; }
}
/* a phone on its side: everything shorter */
@media (max-height: 520px) {
  #hud .title small, #hud .hint { display: none; }
  #hud .views { top: 12px; }
  #hud .panel { top: 40px; width: 300px; max-height: calc(100% - 200px); padding: 8px 12px; }
  #hud .panel .txt { font-size: 10.5px; line-height: 1.45; }
  #hud .vit canvas, #hud .vit .m > div:nth-child(4), #hud .vit .m > div:nth-child(5) { display: none; }
  #hud .bottom { height: 150px; }
  #hud .vit { bottom: 108px !important; }
  #hud .back { bottom: 146px; }
}
