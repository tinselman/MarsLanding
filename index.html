ows, behind which the temperature instantly dropped from −25 °C to −57 °C. We avoided shadows to conserve energy."},{id:"gully",title:"THE GULLY",t:Ui(965),at:On(1e3),onTrail:!0,text:"The short journey was mostly uneventful. Near the end of our trek, after cresting a shallow gully, we arrived in the center of a flat area."},{id:"target",title:"THE TARGET",t:_("satko")-4,at:Le(te(0,0),Mt.y),onTrail:!1,text:"Gazing at my wrist-com, I pointed at the ground: this was the target. I shone my headlamp in every direction, but I saw nothing. Flat ground. Nothing unusual. Gomez stared at me, arms hanging at his side. I recalculated, in case of coordinate-drift."},{id:"search",off:!0,title:"THE SEARCH",t:I.SEARCH,at:Le(te(-12,9),Mt.y),onTrail:!1,text:"For the next few minutes, the four of us chaotically scrambled around the flat, headlamps pointed in every direction. Something had to be transmitting, but the dark quickly closed in around us. Up to a point I had felt warm enough, but soon the frigid surface temperatures began to seep through the insulation of my farm-suit. I turned my suit up three degrees."},{id:"quinn",off:!0,title:"QUINN",t:I.QUINN,at:Fi("satko",I.QUINN),onTrail:!1,screen:["QUINN"],text:"Shivering, I lifted my wrist. In the center of my wrist-com blinked the word QUINN. A short range network. I clumsily tapped my wrist-com. The word disappeared, replaced by: Welcome to Q.U.I.N.N. Research Laboratory."},{id:"identify",off:!0,title:"IDENTIFY",t:I.IDENTIFY,at:Fi("satko",I.IDENTIFY),onTrail:!1,screen:["Identify:  Ida Satko","[SEND]"],text:"Before I touched the screen a second time, another message appeared. I didn’t hesitate to enter my full name: Ida Satko. With the Captain’s permission, I pressed SEND."},{id:"colour",off:!0,title:"PICK A COLOR",t:I.COLOUR,at:Fi("satko",I.COLOUR),onTrail:!1,screen:["Welcome, Ida!","Pick a color","[WHITE]    [BLACK]"],text:"Almost instantly, it welcomed me by name and asked me to pick a color. I pressed WHITE."},{id:"granted",off:!0,title:"APPROVAL GRANTED",t:I.GRANTED,at:Fi("satko",I.GRANTED),onTrail:!1,screen:["IDA SATKO","Approval Granted-","—Initiating unseal procedure—"],text:"But nothing happened. No unsealing. Nevertheless, my heart pounded. We had stumbled upon an uncharted, antiquated network, millions of miles from Earth. I had scaled to the top of a mountain. Now I saw another peak to climb."},{id:"leave",off:!0,title:"FALL IN LINE",t:I.LEAVE,at:Fi("hamlin",I.STOPPED),onTrail:!1,screen:["—Initiating unseal procedure—"],text:"The Captain called it a night. Spinning, she strode away into the darkness, Li after her, single file, Gomez at the rear. A few meters away he stopped and turned; I gave him a thumbs up. I took the last few seconds to search for a phased-array dish, for footprints, for tire-tracks. If there had once been something here, it was covered with a layer of dust. About 30 meters away, they had stopped, their headlamps trained on me."},{id:"jolt",off:!0,title:"THE JOLT",t:I.J1-3,at:Le(k,Mt.y),onTrail:!1,text:"Before I could lift my foot to take a step, the ground jolted upward. A sound, like the snap of metal, travelled through my bones. I was thrown into the air and landed on my back. The Captain’s lamp came bouncing toward me."},{id:"spring",off:!0,title:"THE SPRING",t:I.J2-5,at:Le(ie,Mt.y+1.6),onTrail:!1,text:"I rolled to my hands and knees. A snap ran the length of my body. The ground shot upwards as if held by a spring. I landed on my stomach; pebbles bounced and boiled on all sides. The ground pulsed."},{id:"wrist",off:!0,title:"THE CAPTAIN",t:I.CLIMB-1,at:Le(te(4.5,-2.3),Mt.y+2.2),onTrail:!1,text:"Out of nowhere, someone seized hold of my wrist and dragged me across the dirt. I couldn’t see a thing. Darkness. Screaming thunder came from all directions. It was the Captain."},{id:"fall",off:!0,title:"THE FALL",t:I.J3-2.5,at:Le(pn([Ft.x,Ft.z],an),Ft.y),onTrail:!1,text:"And then… blinding light. I fell through the air. Li and Gomez caught me and practically threw
